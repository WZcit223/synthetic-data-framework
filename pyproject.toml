[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-data-framework"
version = "0.1.0"
description = "Three-layer industrial-AI framework with synthetic-data-driven AI warehouse demo"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
api = ["fastapi", "uvicorn"]
synthesis = ["copulas", "sdmetrics", "pandas"]
synthesis-deep = ["sdv", "faker"]  # CTGAN/TVAE (pulls torch)
app = ["lightgbm"]
causal = ["dowhy>=0.11", "econml>=0.15"]  # pywhy causal stack for simulation / inference backends
dev = ["pytest>=7", "ruff>=0.16.7"]

[project.scripts]
sdf = "sdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sdf.api" = ["static/*.html"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
# Aligned with TsumiNa/sciloom's ruff configuration. Only `target-version`
# (this package supports Python 3.9+) and `src` (single package) differ.
include = ["*.py", "*.pyi"]
exclude = [".venv", "venv", "__pycache__", ".git"]
src = [".", "src"]
line-length = 120
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "TID252"]
ignore = ["F841", "E741", "W505", "E501"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
combine-as-imports = true
no-lines-before = ["local-folder"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
