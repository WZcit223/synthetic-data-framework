[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sdf"

[project]
name = "synthetic-data-framework"
version = "0.14.0"
description = "Three-layer industrial-AI framework with synthetic-data-driven AI warehouse demo"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "scikit-learn>=1.9.1",
    "click>=8.5.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.141.1", "uvicorn>=0.53.0"]
synthesis = ["copulas>=0.14.1", "sdmetrics>=0.31.1", "pandas>=2.3.3,<3"]  # copulas/sdmetrics cap pandas below 3
synthesis-deep = ["sdv>=1.38.3", "faker>=40.39.0"]  # CTGAN/TVAE (pulls torch)
app = ["lightgbm>=4.7.0"]
# pywhy causal stack for simulation / inference backends. dowhy 0.14 declares
# Requires-Python <3.14 and caps scipy at 1.15.3 below 3.13, so it is only
# installable on 3.13 alongside the scipy core floor; lift the marker when upstream catches up.
causal = [
    "econml>=0.17.0",
    "dowhy>=0.14; python_full_version >= '3.13' and python_full_version < '3.14'",
]

[project.scripts]
sdf = "sdf.cli:main"

# Synthesis algorithms are plug-ins. The built-ins are declared here like any
# third-party plug-in; sdf.synthesis.registry.default_registry() mounts the group.
[project.entry-points."sdf.synthesizers"]
bootstrap-table = "sdf.synthesis.bootstrap:BootstrapTable"
gaussian-copula = "sdf.synthesis.sdv_synth:GaussianCopulaTable"
seasonal-profile = "sdf.synthesis.fit:FittedSeasonalDemand"
warehouse-spec = "sdf.synthesis.warehouse:WarehouseSpecSynthesizer"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["src"]

[tool.ruff]
# Aligned with TsumiNa/sciloom's ruff configuration; only `src` (single package)
# differs. The target Python version is inferred from `requires-python`.
include = ["*.py", "*.pyi"]
exclude = [".venv", "venv", "__pycache__", ".git"]
src = [".", "src"]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["F", "E", "W", "I", "TID252"]
ignore = ["F841", "E741", "W505", "E501"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
combine-as-imports = true
no-lines-before = ["local-folder"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false
