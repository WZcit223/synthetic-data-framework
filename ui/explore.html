<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Explore — Synthetic Data Framework</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="explore.css" />
</head>
<body>
<header>
  <h1>🧩 Synthetic Data Framework</h1>
  <nav class="nav" aria-label="Pages">
    <a href="index.html">Dashboard</a>
    <a href="explore.html" aria-current="page">Explore</a>
    <a href="synthesizers.html">Synthesizers</a>
  </nav>
  <div class="layers">
    <span class="badge" style="border-color:var(--warn);color:var(--warn)">synthetic demo data</span>
  </div>
</header>

<main class="wide">
  <section class="card sourcebar" aria-label="Data source">
    <div class="ctrl">
      <label for="source">Source</label>
      <select id="source"></select>
    </div>
    <div class="sourceinfo">
      <div id="sourceTitle" class="sourcetitle"></div>
      <div id="sourceInfo" class="muted"></div>
    </div>
    <div class="presets" id="presets" aria-label="Preset views"></div>
  </section>

  <section class="card expform" id="expForm" hidden aria-label="Experiment request">
    <div class="expgrid">
      <fieldset>
        <legend>Interventions</legend>
        <div id="expInterventions" class="checks"></div>
      </fieldset>
      <fieldset>
        <legend>Policies</legend>
        <div id="expPolicies"></div>
        <button type="button" id="expAddPolicy">+ Add policy</button>
      </fieldset>
      <fieldset>
        <legend>Outcomes</legend>
        <div id="expOutcomes" class="checks"></div>
      </fieldset>
    </div>
    <div class="exprun">
      <button type="button" class="primary" id="expRun">Run experiment</button>
      <span id="expNote" class="muted"></span>
    </div>
  </section>

  <div class="workspace">
    <aside class="card fieldlist" aria-label="Fields">
      <input type="search" id="fieldSearch" placeholder="Search fields" aria-label="Search fields" />
      <div id="fields"></div>
      <p class="note">Drag a field onto a shelf, or press Enter on it to add it where it fits.</p>
    </aside>

    <section class="canvas" aria-label="Pivot">
      <div class="shelves">
        <div class="shelf" data-shelf="rows"><span class="shelf-label">Rows</span><div class="chips"></div>
          <button type="button" class="add" aria-label="Add a field to Rows">+</button></div>
        <div class="shelf" data-shelf="columns"><span class="shelf-label">Columns</span><div class="chips"></div>
          <button type="button" class="add" aria-label="Add a field to Columns">+</button></div>
        <div class="shelf" data-shelf="values"><span class="shelf-label">Values</span><div class="chips"></div>
          <button type="button" class="add" aria-label="Add a field to Values">+</button></div>
        <div class="shelf" data-shelf="filters"><span class="shelf-label">Filters</span><div class="chips"></div>
          <button type="button" class="add" aria-label="Add a filter">+</button></div>
      </div>

      <div class="toolbar" role="toolbar" aria-label="View">
        <div class="seg" role="group" aria-label="Display">
          <button type="button" id="asTable" aria-pressed="true">Table</button>
          <button type="button" id="asChart" aria-pressed="false">Chart</button>
        </div>
        <label class="toggle">Show values as
          <select id="showAs">
            <option value="value">Value</option>
            <option value="share_of_total">Share of total</option>
            <option value="share_of_row">Share of row</option>
            <option value="share_of_column">Share of column</option>
          </select>
        </label>
        <label class="toggle"><input type="checkbox" id="subtotals" /> Subtotals</label>
        <label class="toggle"><input type="checkbox" id="totals" checked /> Totals</label>
        <label class="toggle" data-for="table"><input type="checkbox" id="heatmap" /> Heatmap</label>
        <label class="toggle" data-for="chart"><input type="checkbox" id="stacked" /> Stacked</label>
        <span class="spacer"></span>
        <button type="button" id="swap" title="Swap rows and columns">⇄ Swap</button>
        <button type="button" id="exportCsv">Export CSV</button>
        <button type="button" id="copyLink">Copy link</button>
        <button type="button" id="reset">Reset</button>
      </div>

      <div class="card result" id="result" aria-live="polite"></div>
      <div class="statusline" id="statusline"></div>
    </section>
  </div>
</main>

<div class="popover" id="popover" hidden></div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>

<script type="module" src="explore.js"></script>
</body>
</html>
